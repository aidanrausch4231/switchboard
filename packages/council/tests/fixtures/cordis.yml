- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-session-projection'
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./sessions
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- name: '@deepseek-ai/dsh-storage'
- name: '@deepseek-ai/dsh-storage-json'
  config:
    root: ./storage
- name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- name: '@deepseek-ai/dsh-subagent'
- name: '@deepseek-ai/dsh-subprocess-local'
- id: claude-code-default
  name: '@deepseek-ai/dsh-subagent-claude-code'
- id: claude-code-council
  name: '@switchboard/council/claude-code'
  config:
    providerName: claude-code-council
    permissionMode: plan
- name: ../adapter.ts
- name: '@switchboard/council'
  config:
    chair: a
    seats:
      - { id: a, label: Model A, kind: llm, provider: fake, model: model-a, enabled: true }
      - { id: b, label: Model B, kind: llm, provider: fake, model: model-b, enabled: true }
      - { id: native, label: Claude, kind: subagent, subagent: claude-code, provider: claude-code-council, enabled: true }
      - { id: unsafe, label: Unsafe, kind: subagent, subagent: claude-code, provider: claude-code, enabled: true }
      - { id: codex, label: Codex, kind: subagent, subagent: codex, provider: codex, enabled: true }
